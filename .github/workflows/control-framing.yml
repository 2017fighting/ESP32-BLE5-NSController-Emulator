name: control framing

# The CONTROL plane's host guard (issues #21, #22, #23, #24 and #25, spec
# §2/§3/§4/§5.3/§5.4/§4.9/§6.5/§6.6): the portable COBS+CRC framing, the
# HELLO/STATUS dispatch, the ten verbs over the windowed bulk path, the bulk log
# rate policy, the mode model with the panic stop and the EVENT surface, the plan
# executor with the neutral template, and the NFC state machine and tag server are
# asserted here without the device. The point of the suite is that a log flood
# costs frames but never resets the link, that a truncated-but-CRC-valid plan is
# refused rather than replayed, that the panic stop stops on the press edge yet
# only forgets on a long press's release, that the loop-boundary neutral is
# committed before the pass restarts and that a short macro cannot saturate the
# link with LOOP_COMPLETED, and that a placed tag is served in the capture's own
# read shapes with the tag-absent gap on every tag change — none of which can be
# re-checked by eye on the bench.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  control-framing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: C — framing, dispatch, verbs, mode, executor and log policy
        run: |
          set -euo pipefail
          portable="
            main/src/protocol/control/control_frame.c
            main/src/protocol/control/control_dispatch.c
            main/src/protocol/control/control_bulk.c
            main/src/protocol/control/control_log.c
            main/src/protocol/control/control_events.c
            main/src/protocol/control/control_mode.c
            main/src/protocol/control/control_executor.c
            main/src/protocol/control/control_meter.c"
          for suite in test_control_framing test_control_verbs test_control_mode \
                       test_control_executor test_control_meter; do
            cc -std=c11 -Wall -Wextra -Werror -Imain/include -Itest/host \
              -o "$RUNNER_TEMP/$suite" "test/host/$suite.c" $portable
            "$RUNNER_TEMP/$suite"
          done

      - name: C — the same suites under ASan/UBSan
        run: |
          set -euo pipefail
          portable="
            main/src/protocol/control/control_frame.c
            main/src/protocol/control/control_dispatch.c
            main/src/protocol/control/control_bulk.c
            main/src/protocol/control/control_log.c
            main/src/protocol/control/control_events.c
            main/src/protocol/control/control_mode.c
            main/src/protocol/control/control_executor.c
            main/src/protocol/control/control_meter.c"
          for suite in test_control_framing test_control_verbs test_control_mode \
                       test_control_executor test_control_meter; do
            cc -std=c11 -Wall -Wextra -Werror -g -fsanitize=address,undefined \
              -fno-omit-frame-pointer -Imain/include -Itest/host \
              -o "$RUNNER_TEMP/${suite}_asan" "test/host/${suite}.c" $portable
            "$RUNNER_TEMP/${suite}_asan"
          done

      - name: C — the NFC state machine and tag server (#25)
        run: |
          set -euo pipefail
          for flags in "" "-g -fsanitize=address,undefined -fno-omit-frame-pointer"; do
            cc -std=c11 -Wall -Wextra -Werror $flags -Imain/include -Itest/host \
              -o "$RUNNER_TEMP/test_nfc_tag" test/host/test_nfc_tag.c \
              main/src/controller/nfc_tag.c
            "$RUNNER_TEMP/test_nfc_tag"
            # #46: the same suite under the comparison compile — the superseded
            # plain-offset view, kept so a bench build can compare the two shapes
            # in one reflash (spec §6.6). The default above is the capture's.
            cc -std=c11 -Wall -Wextra -Werror $flags -DNFC_TAG_READ_PLAIN_VIEW=1 \
              -Imain/include -Itest/host -o "$RUNNER_TEMP/test_nfc_tag_plain" \
              test/host/test_nfc_tag.c main/src/controller/nfc_tag.c
            "$RUNNER_TEMP/test_nfc_tag_plain"
            # #36's bench-only path still has to compile: the unsolicited push,
            # which now serves the status the lifecycle arms and the 600-byte
            # space (#48 retired the byte/status knobs its siblings used).
            cc -std=c11 -Wall -Wextra -Werror $flags -DNFC_TAG_PUSH_READ_DATA=1 \
              -Imain/include -Itest/host -o "$RUNNER_TEMP/test_nfc_tag_push" \
              test/host/test_nfc_tag.c main/src/controller/nfc_tag.c
            "$RUNNER_TEMP/test_nfc_tag_push"
          done

      - name: C — the NFC console-traffic trace (#36)
        run: |
          set -euo pipefail
          for flags in "" "-g -fsanitize=address,undefined -fno-omit-frame-pointer"; do
            cc -std=c11 -Wall -Wextra -Werror $flags -Imain/include -Itest/host \
              -o "$RUNNER_TEMP/test_nfc_trace" test/host/test_nfc_trace.c \
              main/src/protocol/control/nfc_trace.c \
              main/src/protocol/control/control_frame.c
            "$RUNNER_TEMP/test_nfc_trace"
          done
