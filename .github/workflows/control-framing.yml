name: control framing

# The CONTROL plane's host guard (issues #21, #22, #23 and #24, spec
# §2/§3/§4/§5.3/§5.4): the portable COBS+CRC framing, the HELLO/STATUS dispatch,
# the ten verbs over the windowed bulk path, the bulk log rate policy, the mode
# model with the panic stop and the EVENT surface, and the plan executor with the
# neutral template are asserted here without the device. The point of the suite is
# that a log flood costs frames but never resets the link, that a
# truncated-but-CRC-valid plan is refused rather than replayed, that the panic
# stop stops on the press edge yet only forgets on a long press's release, and
# that the loop-boundary neutral is committed before the pass restarts and that a
# short macro cannot saturate the link with LOOP_COMPLETED — none of which can be
# re-checked by eye on the bench.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  control-framing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: C — framing, dispatch, verbs, mode, executor and log policy
        run: |
          set -euo pipefail
          portable="
            main/src/protocol/control/control_frame.c
            main/src/protocol/control/control_dispatch.c
            main/src/protocol/control/control_bulk.c
            main/src/protocol/control/control_log.c
            main/src/protocol/control/control_events.c
            main/src/protocol/control/control_mode.c
            main/src/protocol/control/control_executor.c
            main/src/protocol/control/control_meter.c"
          for suite in test_control_framing test_control_verbs test_control_mode \
                       test_control_executor test_control_meter; do
            cc -std=c11 -Wall -Wextra -Werror -Imain/include -Itest/host \
              -o "$RUNNER_TEMP/$suite" "test/host/$suite.c" $portable
            "$RUNNER_TEMP/$suite"
          done

      - name: C — the same suites under ASan/UBSan
        run: |
          set -euo pipefail
          portable="
            main/src/protocol/control/control_frame.c
            main/src/protocol/control/control_dispatch.c
            main/src/protocol/control/control_bulk.c
            main/src/protocol/control/control_log.c
            main/src/protocol/control/control_events.c
            main/src/protocol/control/control_mode.c
            main/src/protocol/control/control_executor.c
            main/src/protocol/control/control_meter.c"
          for suite in test_control_framing test_control_verbs test_control_mode \
                       test_control_executor test_control_meter; do
            cc -std=c11 -Wall -Wextra -Werror -g -fsanitize=address,undefined \
              -fno-omit-frame-pointer -Imain/include -Itest/host \
              -o "$RUNNER_TEMP/${suite}_asan" "test/host/${suite}.c" $portable
            "$RUNNER_TEMP/${suite}_asan"
          done
