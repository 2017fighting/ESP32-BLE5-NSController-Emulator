# The container — Linux canonical form (spec §10.4).
#
# The documented default deployment: one process on python:3.12-slim, the three
# read-only mounts and the one --device passthrough. Build it from the repository
# root (compose resolves `context: ..` against this file's directory):
#
#   docker compose -f container/compose.yaml up --build
#
# On the macOS bench host this file is NOT used alone: the board is not at /dev/ttyACM0 there,
# so it is layered with the override, which changes only the devices: mapping.
#
#   docker compose -f container/compose.yaml up                      # Linux
#   docker compose -f container/compose.yaml \
#                  -f container/compose.macos.yaml up                # macOS (ADR-0014)
#
# The single port is passed through; never --privileged (§10.4).

services:
  controller:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: ghcr.io/<owner>/ns2-controller:latest
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - "$HOME/clone/switch-controller-macro/宏:/library/macros:ro"
      - "$HOME/clone/Amiibo:/library/amiibo:ro"
      - "$HOME/clone/Amiibo/!Essential Files/key_retail.bin:/keys/key_retail.bin:ro"
    ports:
      - "8080:8080"
    restart: unless-stopped
